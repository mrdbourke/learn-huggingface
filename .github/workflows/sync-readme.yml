name: Sync README from index.qmd

on:
  push:
    branches: [main]
    paths:
      - 'index.qmd'
      - '_quarto.yml'
      - '.github/workflows/sync-readme.yml'
  workflow_dispatch: 

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render index.qmd to GFM
        run: |
          quarto render index.qmd --to gfm --output README.md
          mv docs/README.md README.md

      - name: Commit README.md if changed
        # The user.name and user.email below are the GitHub Actions bot identity
        # (user ID 41898282). Commits made with these values are attributed to
        # `github-actions[bot]` with a robot avatar and don't count toward any
        # human's contribution graph. This convention is recommended by the
        # official actions/checkout repo:
        # https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to README.md"
          else
            git commit -m "chore: sync README.md from index.qmd"
            git push
          fi